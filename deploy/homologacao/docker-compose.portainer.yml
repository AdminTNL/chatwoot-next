# Stack de HOMOLOGAÇÃO do Chatwoot (Portainer, modo Swarm).
# Modelo derivado da produção, com nomes próprios, limites de memória e menos concorrência.
# Nenhum segredo aqui: os valores vêm das variáveis da stack (veja .env.example e README.md).
version: '3.8'

services:
  chatwoot-hml-postgres:
    image: pgvector/pgvector:pg12
    volumes:
      - chatwoot-hml-postgres-data:/var/lib/postgresql/data
    environment:
      - POSTGRES_DB=${POSTGRES_DB:?POSTGRES_DB não configurada}
      - POSTGRES_USER=${POSTGRES_USER:?POSTGRES_USER não configurada}
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD:?POSTGRES_PASSWORD não configurada}
    networks:
      - chatwoot-hml_internal
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 10s
      timeout: 5s
      retries: 5
    deploy:
      restart_policy:
        condition: on-failure
      placement:
        constraints:
          - node.role == manager
      resources:
        limits:
          memory: 512M
        reservations:
          memory: 256M

  chatwoot-hml-redis:
    image: redis:6.2-alpine
    command: redis-server --maxmemory 100mb --maxmemory-policy noeviction
    volumes:
      - chatwoot-hml-redis-data:/data
    networks:
      - chatwoot-hml_internal
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    deploy:
      restart_policy:
        condition: on-failure
      placement:
        constraints:
          - node.role == manager
      resources:
        limits:
          memory: 128M
        reservations:
          memory: 64M

  chatwoot-hml-web:
    image: ${CHATWOOT_IMAGE}
    command: sh -c "sleep 15 && bundle exec rails db:prepare && bundle exec rails s -p 3000 -b 0.0.0.0"
    volumes:
      - chatwoot-hml-storage:/app/storage
    environment:
      - FRONTEND_URL=${FRONTEND_URL}
      - SECRET_KEY_BASE=${SECRET_KEY_BASE:?SECRET_KEY_BASE não configurada}
      - RAILS_ENV=${RAILS_ENV:-production}
      - POSTGRES_HOST=chatwoot-hml-postgres
      - POSTGRES_USERNAME=${POSTGRES_USER:?POSTGRES_USER não configurada}
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD:?POSTGRES_PASSWORD não configurada}
      - POSTGRES_DATABASE=${POSTGRES_DB:?POSTGRES_DB não configurada}
      - REDIS_URL=redis://chatwoot-hml-redis:6379
      - ENABLE_ACCOUNT_SEEDING=true
      - ACTIVE_STORAGE_SERVICE=local
      - MAILER_SENDER_EMAIL=${MAILER_SENDER_EMAIL:-}
      - SMTP_ADDRESS=${SMTP_ADDRESS:-}
      - SMTP_PORT=${SMTP_PORT:-587}
      - SMTP_DOMAIN=${SMTP_DOMAIN:-}
      - SMTP_USERNAME=${SMTP_USERNAME:-}
      - SMTP_PASSWORD=${SMTP_PASSWORD:-}
      - SMTP_AUTHENTICATION=${SMTP_AUTHENTICATION:-login}
      - SMTP_ENABLE_STARTTLS_AUTO=${SMTP_ENABLE_STARTTLS_AUTO:-true}
      - SMTP_OPENSSL_VERIFY_MODE=${SMTP_OPENSSL_VERIFY_MODE:-peer}
      - AI_SUGGESTION_SERVICE_URL=${AI_SUGGESTION_SERVICE_URL:-}
      - AI_SUGGESTION_SERVICE_API_KEY=${AI_SUGGESTION_SERVICE_API_KEY:-}
      - WEB_CONCURRENCY=0
      - RAILS_MAX_THREADS=3
    networks:
      - chatwoot-hml_internal
      - adminNet
    deploy:
      replicas: 1
      restart_policy:
        condition: on-failure
      placement:
        constraints:
          - node.role == manager
      resources:
        limits:
          memory: 1G
        reservations:
          memory: 512M
      labels:
        - "traefik.enable=true"
        - "traefik.http.routers.chatwoot-hml.rule=Host(`${TRAEFIK_HOST}`)"
        - "traefik.http.routers.chatwoot-hml.entrypoints=websecure"
        - "traefik.http.routers.chatwoot-hml.tls=true"
        - "traefik.http.routers.chatwoot-hml.tls.certresolver=letsencryptresolver"
        - "traefik.http.routers.chatwoot-hml.service=chatwoot-hml"
        - "traefik.http.services.chatwoot-hml.loadbalancer.passHostHeader=true"
        - "traefik.http.services.chatwoot-hml.loadbalancer.server.port=3000"
        - "traefik.docker.network=adminNet"

  chatwoot-hml-worker:
    image: ${CHATWOOT_IMAGE}
    command: sh -c "sleep 20 && bundle exec sidekiq -C config/sidekiq.yml"
    volumes:
      - chatwoot-hml-storage:/app/storage
    environment:
      - FRONTEND_URL=${FRONTEND_URL}
      - SECRET_KEY_BASE=${SECRET_KEY_BASE:?SECRET_KEY_BASE não configurada}
      - RAILS_ENV=${RAILS_ENV:-production}
      - POSTGRES_HOST=chatwoot-hml-postgres
      - POSTGRES_USERNAME=${POSTGRES_USER:?POSTGRES_USER não configurada}
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD:?POSTGRES_PASSWORD não configurada}
      - POSTGRES_DATABASE=${POSTGRES_DB:?POSTGRES_DB não configurada}
      - REDIS_URL=redis://chatwoot-hml-redis:6379
      - ENABLE_ACCOUNT_SEEDING=true
      - ACTIVE_STORAGE_SERVICE=local
      - MAILER_SENDER_EMAIL=${MAILER_SENDER_EMAIL:-}
      - SMTP_ADDRESS=${SMTP_ADDRESS:-}
      - SMTP_PORT=${SMTP_PORT:-587}
      - SMTP_DOMAIN=${SMTP_DOMAIN:-}
      - SMTP_USERNAME=${SMTP_USERNAME:-}
      - SMTP_PASSWORD=${SMTP_PASSWORD:-}
      - SMTP_AUTHENTICATION=${SMTP_AUTHENTICATION:-login}
      - SMTP_ENABLE_STARTTLS_AUTO=${SMTP_ENABLE_STARTTLS_AUTO:-true}
      - SMTP_OPENSSL_VERIFY_MODE=${SMTP_OPENSSL_VERIFY_MODE:-peer}
      - AI_SUGGESTION_SERVICE_URL=${AI_SUGGESTION_SERVICE_URL:-}
      - AI_SUGGESTION_SERVICE_API_KEY=${AI_SUGGESTION_SERVICE_API_KEY:-}
      - SIDEKIQ_CONCURRENCY=3
    networks:
      - chatwoot-hml_internal
    deploy:
      replicas: 1
      restart_policy:
        condition: on-failure
      placement:
        constraints:
          - node.role == manager
      resources:
        limits:
          memory: 768M
        reservations:
          memory: 384M

volumes:
  chatwoot-hml-postgres-data:
  chatwoot-hml-redis-data:
  chatwoot-hml-storage:

networks:
  chatwoot-hml_internal:
    driver: overlay
  adminNet:
    external: true
