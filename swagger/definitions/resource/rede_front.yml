type: object
properties:
  id:
    type: string
    format: uuid
    description: The public id of the front. It never changes.
  name:
    type: string
    description: The name of the front
  status:
    type: string
    enum:
      - active
      - closed
    description: Whether the front is active or closed
  has_temperature:
    type: boolean
    description: Whether people in this front have a temperature
  updated_at:
    type: string
    format: date-time
    description: When the front was last updated
